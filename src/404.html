<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tic Tac Toe</title>

    <script>
      var segmentCount = 1;

      var location = window.location;
      var redirect =
        location.protocol +
        '//' +
        location.host +
        location.pathname
          .split('/')
          .slice(0, 1 + segmentCount)
          .join('/') +
        '/?p=' +
        encodeURIComponent(
          location.pathname.slice(1) +
            location.search +
            location.hash
        );

      window.location.replace(redirect);
    </script>
  </head>
  <body></body>
</html>
